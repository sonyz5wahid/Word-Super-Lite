plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wordsuperlite'
    compileSdk 33

    defaultConfig {
        applicationId 'com.wordsuperlite'
        minSdk 17
        targetSdk 28
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
